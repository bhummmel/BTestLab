site_name: Brandon Hummel Homelab Portfolio
site_url: https://bhummmel.github.io/BTestLab/
site_description: Infrastructure, networking, automation, AI, VoIP, and systems troubleshooting portfolio
site_author: B H

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

